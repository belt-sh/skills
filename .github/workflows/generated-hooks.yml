name: Generated hooks

# hooks/ and plugins/belt/hooks/ are generated by the belt CLI
# (.github/scripts/generate-hooks.sh). A hand edit, or a CLI release that
# changes what belt installs, shows up here as a stale file. The fix is to
# run the script with the current CLI and commit the result.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the belt CLI
        run: |
          curl -fsSL https://cli.inference.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify hook files match what the belt CLI generates
        run: ./.github/scripts/generate-hooks.sh --check
